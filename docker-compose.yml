services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: "3000"
      NODE_ENV: production
      APP_VERSION: "1.0.2"
      APP_EDITION: "特别版 Docker"
      MONGO_URI: mongodb://mongo:27017/customer_service
      REDIS_URL: redis://redis:6379
      REDIS_CONNECT_TIMEOUT_MS: "2000"
      REDIS_CACHE_TTL_SECONDS: "300"
      JWT_SECRET: ${JWT_SECRET:?请先配置 JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      CUSTOMER_JWT_EXPIRES_IN: 3650d
      CORS_ORIGIN: ${CORS_ORIGIN:?请先配置 CORS_ORIGIN}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:?请先配置管理员账号}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?请先配置管理员密码}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@example.com}
      DEFAULT_TENANT_NAME: ${DEFAULT_TENANT_NAME:-默认企业}
      DEFAULT_TENANT_USERNAME: ${DEFAULT_TENANT_USERNAME:?请先配置租户账号}
      DEFAULT_TENANT_PASSWORD: ${DEFAULT_TENANT_PASSWORD:?请先配置租户密码}
      CLIENT_PUBLIC_URL: ${CLIENT_PUBLIC_URL:?请先配置客户聊天端地址}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  admin-web:
    build: ./admin-web
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:?请先配置平台管理端口}:80"
    depends_on:
      server:
        condition: service_healthy

  user-web:
    build: ./user-web
    restart: unless-stopped
    ports:
      - "${USER_PORT:?请先配置租户客服端口}:80"
    depends_on:
      server:
        condition: service_healthy

  client-web:
    build: ./client-web
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:?请先配置客户聊天端口}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongo_data:
  redis_data:
  uploads_data:
