# 忆梦云团队开发
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # 1024 MiB single file plus 5 MiB multipart envelope.
  client_max_body_size 1029m;
  location ^~ /api/files/ { proxy_buffering off; proxy_cache off; proxy_pass http://server:3000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /api/ { proxy_pass http://server:3000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /uploads/ { proxy_pass http://server:3000; proxy_set_header Host $host; }
  location /socket.io/ { proxy_pass http://server:3000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_read_timeout 60s; }
  location ~* "^/assets/.*-[A-Za-z0-9_-]{8,}\.(?:js|css|woff2?|svg|png|jpe?g|gif|webp|ico)$" { try_files $uri =404; expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location = /widget.js { try_files $uri =404; add_header Cache-Control "public, max-age=300, must-revalidate"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
