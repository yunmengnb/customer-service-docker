# 忆梦云团队开发
services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: ["mongod", "--replSet", "${MONGO_REPLICA_SET:-kf-rs0}", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh 'mongodb://127.0.0.1:27017/admin?directConnection=true' --quiet --eval \"const h=db.adminCommand({hello:1}); quit(h.setName==='${MONGO_REPLICA_SET:-kf-rs0}' && h.isWritablePrimary===true ? 0 : 1)\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  mongo-init:
    image: mongo:7.0
    restart: "no"
    environment:
      MONGO_REPLICA_SET: ${MONGO_REPLICA_SET:-kf-rs0}
      MONGO_REPLICA_HOST: mongo:27017
      MONGO_INIT_URI: mongodb://mongo:27017/admin?directConnection=true
      MONGO_INIT_TIMEOUT_SECONDS: "120"
    volumes:
      - ./mongo-init.sh:/usr/local/bin/mongo-init.sh:ro
    depends_on:
      mongo:
        condition: service_started
    entrypoint: ["/bin/sh", "/usr/local/bin/mongo-init.sh"]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  server:
    build: ./server
    restart: "on-failure:5"
    environment:
      PORT: "3000"
      NODE_ENV: production
      APP_VERSION: "1.0.5"
      APP_EDITION: "特别版 Docker"
      MONGO_URI: mongodb://mongo:27017/customer_service?replicaSet=${MONGO_REPLICA_SET:-kf-rs0}&authSource=admin&directConnection=true
      REDIS_URL: redis://redis:6379
      REDIS_CONNECT_TIMEOUT_MS: "2000"
      REDIS_CACHE_TTL_SECONDS: "300"
      JWT_SECRET: ${JWT_SECRET:?请先配置 JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      CUSTOMER_JWT_EXPIRES_IN: 3650d
      CORS_ORIGIN: ${CORS_ORIGIN:?请先配置 CORS_ORIGIN}
      ADMIN_PUBLIC_ORIGIN: ${ADMIN_PUBLIC_ORIGIN:-}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:?请先配置管理员账号}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?请先配置管理员密码}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@example.com}
      DEFAULT_TENANT_NAME: ${DEFAULT_TENANT_NAME:-默认企业}
      DEFAULT_TENANT_USERNAME: ${DEFAULT_TENANT_USERNAME:?请先配置租户账号}
      DEFAULT_TENANT_PASSWORD: ${DEFAULT_TENANT_PASSWORD:?请先配置租户密码}
      CLIENT_PUBLIC_URL: ${CLIENT_PUBLIC_URL:?请先配置客户聊天端地址}
      WECHAT_PUBLIC_ORIGIN: ${WECHAT_PUBLIC_ORIGIN:-}
      WECHAT_CREDENTIAL_KEY: ${WECHAT_CREDENTIAL_KEY:-}
      WECHAT_NOTIFICATION_LINK_KEY: ${WECHAT_NOTIFICATION_LINK_KEY:-}
      MIGRATION_FEATURE_AVAILABLE: ${MIGRATION_FEATURE_AVAILABLE:-false}
      MIGRATION_DATA_PLANE_ENABLED: ${MIGRATION_DATA_PLANE_ENABLED:-false}
      MIGRATION_ACTIVE_POINTER_ENABLED: ${MIGRATION_ACTIVE_POINTER_ENABLED:-false}
      MIGRATION_CONTROL_URI: mongodb://mongo:27017/customer_service_control?replicaSet=${MONGO_REPLICA_SET:-kf-rs0}&authSource=admin&directConnection=true
      MIGRATION_CONTROL_DB: customer_service_control
      MIGRATION_MASTER_KEY: ${MIGRATION_MASTER_KEY:-}
      MIGRATION_RESTART_MODE: docker
      MIGRATION_RESTART_EXIT_CODE: "75"
      INSTANCE_REPLICA_COUNT: "1"
      UPLOAD_DIR: /app/upload-generations/active
      MIGRATION_STAGING_DIR: /app/upload-generations/.migration-private/staging
      MIGRATION_BACKUP_DIR: /app/migration-backup
      MIGRATION_TEMP_DIR: /app/migration-temp
    volumes:
      - uploads_data:/app/upload-generations
      - migration_backup_data:/app/migration-backup
      - migration_temp_data:/app/migration-temp
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>r.json().then(b=>{if(!r.ok||b.services?.mongo!=='primary'||b.services?.redis!=='up')process.exit(1)})).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  admin-web:
    build: ./admin-web
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:?请先配置平台管理端口}:80"
    depends_on:
      server:
        condition: service_healthy

  user-web:
    build: ./user-web
    restart: unless-stopped
    ports:
      - "${USER_PORT:?请先配置租户客服端口}:80"
    depends_on:
      server:
        condition: service_healthy

  client-web:
    build: ./client-web
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:?请先配置客户聊天端口}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongo_data:
  redis_data:
  uploads_data:
  migration_backup_data:
  migration_temp_data:
