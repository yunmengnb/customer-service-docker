// 忆梦云团队开发
plugins {
    id 'com.android.application'
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

def releasePropertiesFile = rootProject.file('signing/customer-release-v2.properties')
def releaseProperties = new Properties()
if (releasePropertiesFile.isFile()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}
def releaseValue = { String name ->
    def environmentValue = providers.environmentVariable(name).orNull
    environmentValue ?: releaseProperties.getProperty(name) ?: providers.gradleProperty(name).orNull ?: ''
}
def releaseKeystorePath = releaseValue('CUSTOMER_RELEASE_STORE_FILE')
def releaseKeystore = releaseKeystorePath ? rootProject.file(releaseKeystorePath) : null
def releaseStorePassword = releaseValue('CUSTOMER_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = releaseValue('CUSTOMER_RELEASE_KEY_ALIAS')
def releaseKeyPassword = releaseValue('CUSTOMER_RELEASE_KEY_PASSWORD')
def releaseBuildRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase(Locale.ROOT).contains('release')
}
def releaseSigningReady = releaseKeystore?.isFile() && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

if (releaseBuildRequested && !releaseSigningReady) {
    throw new GradleException(
            'Release 签名配置不完整。请配置 signing/customer-release-v2.properties，' +
                    '或通过环境变量/用户级 ~/.gradle/gradle.properties 设置 CUSTOMER_RELEASE_STORE_FILE、' +
                    'CUSTOMER_RELEASE_STORE_PASSWORD、CUSTOMER_RELEASE_KEY_ALIAS、CUSTOMER_RELEASE_KEY_PASSWORD。'
    )
}

android {
    namespace 'com.chat.ymykf'
    compileSdk 35

    defaultConfig {
        applicationId 'com.chat.ymykf'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile releaseKeystore
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation('io.socket:socket.io-client:2.1.1') {
        exclude group: 'org.json', module: 'json'
    }
}
